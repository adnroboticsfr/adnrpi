# Xorg config — ADNRPi HackPad
# Force la résolution 800x480 sur la sortie HDMI.
# Le driver modesetting (Lima/H3) peut auto-sélectionner 1280x720 depuis l'EDID
# si la carte ou le câble est reconnecté à froid. Ce fichier force 800x480.

Section "Monitor"
    Identifier  "HDMI-1"
    Option      "PreferredMode" "800x480"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Monitor     "HDMI-1"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "800x480"
    EndSubSection
EndSection
