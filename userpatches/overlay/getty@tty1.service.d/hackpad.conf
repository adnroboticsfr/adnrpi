[Unit]
# getty@tty1 ne tourne que si setup.conf est absent (avant la configuration initiale).
# Une fois setup.conf créé, HackPad prend vt1 via ConditionPathExists dans hackpad.service.
ConditionPathExists=!/etc/adnrpi/setup.conf

[Service]
# Auto-login root sur tty1 avant la configuration initiale.
# Le profile.d/adnrpi-setup.sh lance le wizard dès que root est connecté.
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
