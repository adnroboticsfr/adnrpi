[Unit]
# getty@tty1 ne tourne que si setup.conf est présent (wizard terminé).
# Avant setup.conf : adnrpi-wizard.service prend tty1 (Conflicts= ci-dessus).
# Après setup.conf : hackpad.service prend vt1 (Conflicts= dans hackpad.service).
ConditionPathExists=/etc/adnrpi/setup.conf

[Service]
# Login shell normal après le wizard — root avec mot de passe configuré.
ExecStart=
ExecStart=-/sbin/agetty --noclear %I $TERM
