[Unit]
# Pas de ConditionPathExists ici — getty est toujours disponible comme fallback.
# Sur premier boot : auto-login root → wizard (setup.conf absent).
# Après setup : si hackpad/scope/launcher ne démarre pas, getty fournit un shell.
# Quand hackpad tourne, Conflicts= dans hackpad.service arrête getty proprement.

[Service]
# Auto-login root sur tty1 (pentest — pas de mot de passe à taper au boot).
# Le profile.d/adnrpi-setup.sh lance le wizard si setup.conf absent,
# sinon un shell root normal est disponible.
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
