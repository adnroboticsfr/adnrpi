[Unit]
# Getty tourne UNIQUEMENT si setup.conf est absent (premier boot, wizard pas encore fait).
# Une fois setup.conf créé, hackpad.service prend vt1 (Conflicts= dans hackpad.service).
# Les deux conditions sont en miroir : une seule des deux peut être vraie à la fois.
ConditionPathExists=!/etc/adnrpi/setup.conf

[Service]
# Auto-login root sur tty1 avant la configuration initiale.
# Profile.d lance le wizard dès que root est connecté.
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
